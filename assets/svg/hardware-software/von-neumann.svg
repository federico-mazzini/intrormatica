<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"><style>text{font-family:Arial,Liberation Sans,sans-serif;font-size:21px;fill:#292a2a}.small{font-size:18px;fill:#555}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#16717B"/></marker></defs><rect x="300" y="15" width="300" height="85" rx="5" fill="#fafafa" stroke="#16717B" stroke-width="2"/><text x="450.0" y="45" text-anchor="middle">MEMORIA CENTRALE</text><text x="450.0" y="72" text-anchor="middle">dati e istruzioni</text><rect x="300" y="175" width="300" height="100" rx="5" fill="#fafafa" stroke="#16717B" stroke-width="2"/><text x="450.0" y="205" text-anchor="middle">CPU</text><text x="450.0" y="232" text-anchor="middle">controlla ed esegue</text><rect x="15" y="175" width="210" height="100" rx="5" fill="#fafafa" stroke="#16717B" stroke-width="2"/><text x="120.0" y="205" text-anchor="middle">INPUT</text><text x="120.0" y="232" text-anchor="middle">dati in ingresso</text><rect x="675" y="175" width="210" height="100" rx="5" fill="#fafafa" stroke="#16717B" stroke-width="2"/><text x="780.0" y="205" text-anchor="middle">OUTPUT</text><text x="780.0" y="232" text-anchor="middle">risultati</text><path d="M450 105V169" fill="none" stroke="#16717B" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M230 225H294" fill="none" stroke="#16717B" stroke-width="2.5" marker-end="url(#a)"/><path d="M606 225H669" fill="none" stroke="#16717B" stroke-width="2.5" marker-end="url(#a)"/><text x="468" y="142" class="small">collegamenti / bus</text><text x="450" y="327" text-anchor="middle" class="small">Modello semplificato di Von Neumann.</text><text x="450" y="355" text-anchor="middle" class="small">L’archiviazione conserva i programmi; la memoria centrale li rende disponibili al lavoro.</text></svg>