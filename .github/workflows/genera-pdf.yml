name: Genera PDF delle dispense

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genera-pdf:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pdf]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installa Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - name: Installa i font dei diagrammi
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-liberation
      - name: Compila tutte le dispense
        run: bash scripts/build-all.sh
      - name: Pubblica i PDF
        uses: actions/upload-artifact@v4
        with:
          name: dispense-informatica-pdf
          path: |
            dist/1-file-cartelle.pdf
            dist/2-inviare-condividere-file.pdf
            dist/3-bit-byte-dimensioni.pdf
            dist/4-introduzione-computer.pdf
            dist/5-software.pdf
            dist/6-hardware.pdf
            dist/7-funzionamento-computer.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Pubblica gli archivi sorgenti
        uses: actions/upload-artifact@v4
        with:
          name: dispense-informatica-sorgenti
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90
